<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
    <link rel="stylesheet" href="./static/css/output.css" type="text/css" />
    <link rel="stylesheet" href="./static/css/manual.css" type="text/css" />
</head>
<body class="bg-white text-black font-serif">
    <!-- Navbar -->
    <header class="p-6 flex justify-between items-center border-b">
        <h1 class="text-2xl font-bold">MyPortfolio</h1>
        <nav class="space-x-6">
            <a href="/" class="hover:underline">Home</a>
            <a href="/contact" class="hover:underline">Contact</a>
        </nav>
    </header>

    <main class="max-w-2xl mx-auto p-10">
        <h2 class="text-4xl font-bold mb-6">Get in Touch</h2>

        <!-- Notifications -->
        {% if success %}
        <div class="mb-4 p-4 rounded-md bg-green-100 text-green-800 border border-green-300">
            ✅ Your message has been sent successfully!
        </div>
        {% endif %}
        {% if error %}
        <div class="mb-4 p-4 rounded-md bg-red-100 text-red-800 border border-red-300">
            ❌ Error: {{ error }}
        </div>
        {% endif %}

        <!-- Contact Form -->
        <form method="post" action="/contact" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label class="block mb-2 text-sm font-medium">Name</label>
                <input type="text" name="name" required class="w-full border p-3 rounded-md">
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium">Email</label>
                <input type="email" name="email" required class="w-full border p-3 rounded-md">
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium">Subject</label>
                <input type="text" name="subject" required class="w-full border p-3 rounded-md">
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium">Message</label>
                <textarea name="message" required rows="5" class="w-full border p-3 rounded-md"></textarea>
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium">Attachment (optional)</label>
                <input type="file" name="file" class="w-full border p-2 rounded-md">
            </div>
            <button type="submit"
                    class="bg-black text-white px-6 py-3 rounded-md hover:bg-gray-800 transition">
                Send
            </button>
        </form>
    </main>
</body>
</html>
