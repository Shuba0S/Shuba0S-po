<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #000014, #1a0033, #0a001a);
            z-index: 50;
            transition: opacity 0.5s ease;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(138, 43, 226, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 12px 3px rgba(138, 43, 226, 0.5);
            animation: float 6s linear infinite;
        }

        @keyframes float {
            from {
                transform: translateY(100vh);
            }

            to {
                transform: translateY(-10vh);
            }
        }

        #welcome-text {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            margin-bottom: 1rem;
            z-index: 10;
            text-shadow: 0 0 10px #ba55d3, 0 0 20px #ba55d3;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid rgba(186, 85, 211, 0.9);
            border-radius: 50%;
            width: 64px;
            height: 64px;
            animation: spin 1s linear infinite;
            z-index: 10;
            box-shadow: 0 0 10px rgba(186, 85, 211, 0.7);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #main-content.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div id="loader">
        <!-- Particle background -->
        <div id="particles"></div>

        <!-- Welcome Text -->
        <div id="welcome-text">Welcome</div>
        <div class="spinner"></div>
    </div>

    <!-- Hidden index content -->
    <div id="main-content" class="hidden">
        {% include 'index.html' %}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const messages = ["Welcome", "ಸ್ವಾಗತ", "स्वागत है", "స్వాగతం"];
            const welcomeText = document.getElementById("welcome-text");
            const loader = document.getElementById("loader");
            const particlesContainer = document.getElementById("particles");
            const main = document.getElementById("main-content");

            if (welcomeText && loader && particlesContainer) {
                messages.forEach((msg, index) => {
                    setTimeout(() => {
                        welcomeText.textContent = msg;
                    }, index * 1000);
                });

                setTimeout(() => {
                    loader.style.opacity = "0";
                    setTimeout(() => {
                        loader.style.display = "none";
                        if (main) main.classList.remove("hidden");
                    }, 500);
                }, messages.length * 1000);

                for (let i = 0; i < 100; i++) {
                    const particle = document.createElement("div");
                    particle.classList.add("particle");
                    particle.style.left = Math.random() * 100 + "vw";
                    particle.style.top = Math.random() * 100 + "vh";
                    particle.style.animationDuration = (3 + Math.random() * 5) + "s";
                    particle.style.opacity = Math.random();
                    particlesContainer.appendChild(particle);
                }
            }
        });
    </script>
</body>
</html>
