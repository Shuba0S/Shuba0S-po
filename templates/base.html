<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shuba S</title>
    <link rel="icon" href="/static/icons/favicon.ico" type="image/x-icon">
    <link href="./static/css/output.css" rel="stylesheet" />
    <script src="/static/js/script.js"></script>
    <link href="./static/css/manual.css" rel="stylesheet" />
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.24/build/spline-viewer.js"></script>
    <style>
        .spline-bg-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: auto;
            overflow: hidden;
            background: url(https://prod.spline.design/N2fEeKdhHWY28oNM/scene.splinecode);
            transform: scale(1.2);
        }

            .spline-bg-container spline-viewer {
                width: 100vw !important;
                height: 100vh !important;
                min-width: 100vw;
                min-height: 100vh;
                max-width: 100vw;
                max-height: 100vh;
                display: block;
                pointer-events: auto;
            }

        body, html {
            min-height: 100vh;
            background: transparent !important;
        }

        main, #mobile-menu, #nav-links {
            z-index: 1;
            background: transparent;
        }
        header {
            backdrop-filter: blur(10px);
            box-shadow: 0px 0px 30px rgba(227,228,237,0.37);
            border: 2px solid rgba(255,255,255,0.18);
            padding: 10px;
            margin-top: 24px;
            margin-right: 10px;
            margin-left: 10px;
            border-radius: 1rem;
            justify-content:center;
        }
    </style>
</head>
<body>
    {% if not no_background %}
    <div class="spline-bg-container">
        <spline-viewer url="https://prod.spline.design/N2fEeKdhHWY28oNM/scene.splinecode"></spline-viewer>
    </div>
    {% endif %}
    {% if not no_navbar %}
    <header class="sticky top-0 z-50 mx-8 mt-6 rounded-2xl backdrop-blur-md bg-white/10 border border-white/20 shadow-lg" style="z-index:9999">
        <nav class="max-w-7xl mx-auto flex items-center justify-between px-4 py-2">
            <div class="text-2xl font-bold text-blue-400">Shuba <span class="text-white">S</span></div>
            <div class="lg:hidden text-white text-3xl cursor-pointer" id="menu-btn">☰</div>
            <ul id="nav-links" class="hidden lg:flex space-x-6 text-lg text-white">
                <li><a href="/" class="nav-link hover:text-blue-400 transition hover:scale-105 hover:shadow-xl">Home</a></li>
                <li><a href="/#services" class="nav-link hover:text-blue-400 transition hover:scale-105 hover:shadow-xl">Services</a></li>
                <li><a href="/#projects" class="nav-link hover:text-blue-400 transition hover:scale-105 hover:shadow-xl">Projects</a></li>
                <li><a href="/#education" class="nav-link hover:text-blue-400 transition hover:scale-105 hover:shadow-xl">Education</a></li>
                <li><a href="/#contact" class="nav-link hover:text-blue-400 transition hover:scale-105 hover:shadow-xl">Contact</a></li>
            </ul>
        </nav>
        {% endif %}
        <!-- Mobile Menu -->
        <ul id="mobile-menu" class="lg:hidden hidden flex-col space-y-2 bg-gray-800 px-4 pb-4 text-lg text-white">
            <li><a href="/" class="block py-2 hover:text-blue-400 transition">Home</a></li>
            <li><a href="#services" class="block py-2 hover:text-blue-400 transition hover:scale-105 hover:shadow-xl">Services</a></li>
            <li><a href="#projects" class="block py-2 hover:text-blue-400 transition hover:scale-105 hover:shadow-xl">Projects</a></li>
            <li><a href="#education" class="block py-2 hover:text-blue-400 transition hover:scale-105 hover:shadow-xl">Education</a></li>
            <li><a href="#contact" class="block py-2 hover:text-blue-400 transition hover:scale-105 hover:shadow-xl">Contact</a></li>
        </ul>
    </header>
    <main class="px-6 py-10 max-w-7xl mx-auto">

        {% block content %}{% endblock %}
    </main>
</body>
</html>
